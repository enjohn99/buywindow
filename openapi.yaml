openapi: 3.1.0
info:
  title: BuyWindow API
  version: 0.10.0
  description: API for cross-retailer product discovery, canonical identity, trusted price history, and human review.
servers:
  - url: http://localhost:8080
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
paths:
  /health:
    get:
      summary: Service health
      responses:
        "200":
          description: Healthy service
  /v1/search:
    post:
      summary: Discover and canonicalize shopping results
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                location:
                  type: string
                destination:
                  type: object
                  properties:
                    line1:
                      type: string
                    line2:
                      type: string
                    city:
                      type: string
                    state:
                      type: string
                    postalCode:
                      type: string
                    country:
                      type: string
                fulfillment:
                  type: string
                  enum: [shipping, pickup, delivery]
                taxCategory:
                  type: string
                  default: general_tangible_goods
                taxCode:
                  type: string
                  default: txcd_99999999
                maxTaxCalculations:
                  type: integer
                  minimum: 0
                gl:
                  type: string
                hl:
                  type: string
      responses:
        "200":
          description: Search and canonicalization results
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
  /v1/products/{productId}:
    get:
      summary: Get a canonical product
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Canonical product
        "404":
          description: Product not found
  /v1/reviews/{reviewId}:
    get:
      summary: Get a pending review
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Review record
        "404":
          description: Review not found
  /v1/reviews/{reviewId}/resolve:
    post:
      summary: Resolve a pending review
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: reviewId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [same_product, variant, new_product, alternative, reject]
                productId:
                  type: string
                reviewer:
                  type: string
                note:
                  type: string
                overrides:
                  type: object
      responses:
        "200":
          description: Resolved review
        "400":
          description: Invalid request
        "401":
          description: Unauthorized
        "404":
          description: Review not found

  /v1/products:
    get:
      summary: List canonical product summaries
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Canonical product summaries
  /v1/products/{productId}/history:
    get:
      summary: Get trusted observed price history and descriptive statistics
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 2000
      responses:
        "200":
          description: Product, history summary, and observations
        "404":
          description: Product not found

  /v1/products/{productId}/decision:
    get:
      summary: Get conservative Buy/Wait analysis from trusted price history
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Decision, confidence, rationale, and metrics
        "404":
          description: Product not found
